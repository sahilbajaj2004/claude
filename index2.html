<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organic Product Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f1f7ef;
      --card: #fbfdf9;
      --text: #1f2b22;
      --accent: #2f7a5d;
      --accent2: #c7e36f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Manrope, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, #d8efca 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, #d7e8ff 0%, transparent 45%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: min(430px, 92vw);
      background: var(--card);
      border-radius: 28px;
      padding: 1.2rem;
      box-shadow: 0 20px 70px rgba(30, 45, 38, .16);
      position: relative;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      width: 190px;
      height: 190px;
      right: -45px;
      top: -50px;
      background: linear-gradient(135deg, #b7e07f, #8ac68a);
      border-radius: 62% 38% 56% 44% / 51% 52% 48% 49%;
      opacity: .58;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(8px) rotate(6deg); }
    }

    .media {
      height: 220px;
      border-radius: 20px;
      background: linear-gradient(140deg, #84b59f, #2f7a5d 65%, #205645);
      position: relative;
      overflow: hidden;
    }

    .media:before {
      content: "";
      position: absolute;
      inset: 22px 18px auto auto;
      width: 110px;
      height: 110px;
      background: rgba(255, 255, 255, .24);
      border-radius: 50%;
      filter: blur(2px);
    }

    .tag {
      display: inline-block;
      margin-top: 1rem;
      padding: .3rem .7rem;
      border-radius: 999px;
      background: #edf6e9;
      color: #2f7a5d;
      font-weight: 700;
      font-size: .8rem;
    }

    h2 {
      margin: .7rem 0 .4rem;
      font-family: Fraunces, serif;
      font-size: 2rem;
      line-height: 1.05;
    }

    p {
      margin: 0;
      color: #43544a;
      line-height: 1.5;
    }

    .row {
      margin-top: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-weight: 800;
      font-size: 1.2rem;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: .72rem 1rem;
      background: var(--text);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #0f1712;
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="blob"></div>
    <div class="media"></div>
    <span class="tag">eco favorite</span>
    <h2>Moss Ceramic Bottle</h2>
    <p>Soft geometry, natural palette, and tactile motion cues for a calming commerce surface.</p>
    <div class="row">
      <span class="price">$64</span>
      <button>Add to Cart</button>
    </div>
  </article>
</body>
</html>
