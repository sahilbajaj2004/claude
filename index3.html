<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Transit Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1418;
      --panel: #131c22;
      --line: #2be1a3;
      --warn: #ffd34f;
      --text: #d9f7ee;
      --dim: #7ea59b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, #0b1013, #101a20 60%, #0a0f12),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px);
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "IBM Plex Mono", monospace;
      color: var(--text);
    }

    .widget {
      width: min(520px, 92vw);
      background: var(--panel);
      border: 1px solid #254238;
      box-shadow: 0 0 0 1px rgba(43, 225, 163, .15), 0 24px 60px rgba(0, 0, 0, .55);
      border-radius: 18px;
      padding: 1rem;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .8rem;
      font-family: "Chakra Petch", sans-serif;
    }

    .status {
      font-size: .78rem;
      color: #03120c;
      background: var(--line);
      border-radius: 999px;
      padding: .2rem .6rem;
      font-weight: 700;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(43, 225, 163, .5); }
      70% { box-shadow: 0 0 0 10px rgba(43, 225, 163, 0); }
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .7rem;
    }

    .cell {
      border: 1px solid #22453b;
      border-radius: 12px;
      padding: .7rem .75rem;
      background: linear-gradient(160deg, rgba(43, 225, 163, .06), transparent);
    }

    .label {
      font-size: .72rem;
      color: var(--dim);
    }

    .value {
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .bar {
      margin-top: .8rem;
      height: 9px;
      border-radius: 999px;
      background: #1b2c25;
      overflow: hidden;
    }

    .fill {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, var(--line), var(--warn));
      animation: slide 2.6s ease-in-out infinite alternate;
    }

    @keyframes slide {
      from { width: 62%; }
      to { width: 79%; }
    }
  </style>
</head>
<body>
  <section class="widget">
    <div class="top">
      <strong>Metro Control / Line A</strong>
      <span class="status">LIVE</span>
    </div>
    <div class="grid">
      <div class="cell"><div class="label">Next Train</div><div class="value">2m</div></div>
      <div class="cell"><div class="label">Platform Load</div><div class="value">73%</div></div>
      <div class="cell"><div class="label">Avg Delay</div><div class="value">+45s</div></div>
      <div class="cell"><div class="label">Service Health</div><div class="value">98.4%</div></div>
    </div>
    <div class="bar"><div class="fill"></div></div>
  </section>
</body>
</html>
