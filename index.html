<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editorial Split Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f5f2ea;
      --ink: #151515;
      --accent: #cc2f2f;
      --muted: #585858;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .hero {
      width: min(1100px, 92vw);
      border: 2px solid var(--ink);
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      background: linear-gradient(165deg, #f7f4ec 0%, #ece7dd 100%);
      box-shadow: 10px 10px 0 var(--ink);
    }

    .left {
      padding: 3rem 2.5rem 2.2rem;
      position: relative;
    }

    .kicker {
      letter-spacing: .14em;
      text-transform: uppercase;
      font-size: .76rem;
      font-weight: 700;
      color: var(--accent);
    }

    h1 {
      margin: .8rem 0 1rem;
      font-family: "Bodoni Moda", serif;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: .92;
      max-width: 16ch;
    }

    .desc {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
      max-width: 48ch;
    }

    .cta {
      margin-top: 1.4rem;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: #fff;
      padding: .78rem 1rem;
      font-weight: 700;
      letter-spacing: .03em;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      box-shadow: 4px 4px 0 #000;
    }

    .cta:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    .stamp {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      border: 2px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      padding: .45rem .8rem;
      font-weight: 700;
      transform: rotate(-8deg);
    }

    .right {
      min-height: 420px;
      border-left: 2px solid var(--ink);
      position: relative;
      background: repeating-linear-gradient(
        -32deg,
        rgba(0, 0, 0, .03) 0 8px,
        transparent 8px 18px
      );
    }

    .panel {
      position: absolute;
      inset: 12% 10%;
      border: 2px solid var(--ink);
      background: #fff;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel strong { font-size: 1.4rem; }
    .panel p { margin: .4rem 0 0; color: #444; }

    .line {
      width: 100%;
      height: 8px;
      background: linear-gradient(90deg, var(--ink) 0 70%, var(--accent) 70% 100%);
    }

    @media (max-width: 880px) {
      .hero { grid-template-columns: 1fr; }
      .right {
        border-left: none;
        border-top: 2px solid var(--ink);
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="left">
      <div class="kicker">Issue 07 • Design Culture</div>
      <h1>Make interfaces people remember.</h1>
      <p class="desc">An unapologetically editorial landing composition with hard edges, disciplined spacing, and one loud accent.</p>
      <button class="cta">Read Feature</button>
      <div class="stamp">Curated</div>
    </div>
    <aside class="right">
      <div class="panel">
        <div>
          <strong>Grid is a suggestion.</strong>
          <p>Break symmetry with intention.</p>
        </div>
        <div class="line"></div>
      </div>
    </aside>
  </section>
</body>
</html>
